services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-supplychainiq}
      POSTGRES_USER: ${WAREHOUSE_USER:-sci_loader}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-change_me}
    ports:
      - "${WAREHOUSE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./warehouse/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-sci_loader}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
